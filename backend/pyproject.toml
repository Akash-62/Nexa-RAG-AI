[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexa-rag-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # Config & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",

    # Auth
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",

    # LangChain ecosystem
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langchain-openai>=0.1",
    "langchain-anthropic>=0.1",
    "langchain-google-genai>=1.0",
    "langchain-groq>=0.1",
    "langgraph>=0.1",

    # Vector store
    "chromadb>=0.5",
    "langchain-chroma>=0.1",
    "sentence-transformers>=3.0",

    # Document parsing
    "pypdf>=4.0",
    "python-docx>=1.1",

    # LLM SDKs (loaded on demand via LangChain)
    "openai>=1.35",
    "anthropic>=0.28",
    "google-generativeai>=0.7",
    "tiktoken>=0.7",

    # Utilities
    "httpx>=0.27",
    "python-slugify>=8.0",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
